site_name: Projet 403 — Crazy Dust 2027
site_description: Préparation d'une Peugeot 403 break pour le raid Crazy Dust 2027
site_author: DrZoid
site_url: https://docteurzoidberg.github.io/403/
repo_url: https://github.com/docteurzoidberg/403
repo_name: docteurzoidberg/403

# docs_dir = web/docs/ : symlinks vers README.md, vehicule/, raid/ (contenu source à la racine)
# site_dir = web/build/ : artefacts de build
docs_dir: docs
site_dir: build

theme:
  name: material
  custom_dir: overrides
  language: fr
  logo: assets/logo.png
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

extra:
  generator: false

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.mark

# Fichiers présents dans docs_dir mais qu'on ne publie pas
exclude_docs: |
  raid/02-sponsoring/sponsors/**
  raid/02-sponsoring/modele-orga/**

nav:
  - Accueil: README.md
  - Véhicule:
    - Achat:
      - Journal: vehicule/01-achat/suivi.md
      - Galerie: galeries/01-achat.md
    - Préparation export:
      - À faire: vehicule/02-preparation-export/taches.md
      - Pièces à acheter: vehicule/02-preparation-export/pieces-a-acheter.md
      - Journal: vehicule/02-preparation-export/suivi.md
      - Galerie: galeries/02-preparation-export.md
    - Restauration Maroc:
      - À faire: vehicule/03-restauration-maroc/taches.md
      - Journal: vehicule/03-restauration-maroc/suivi.md
      - Galerie: galeries/03-restauration-maroc.md
    - Préparation raid:
      - À faire: vehicule/04-preparation-raid/taches.md
      - Gadgets: vehicule/04-preparation-raid/gadgets.md
      - Journal: vehicule/04-preparation-raid/suivi.md
      - Galerie: galeries/04-preparation-raid.md
    - Fiches techniques:
      - Dynamo → Alternateur: vehicule/fiches/dynamo-alternateur/fiche.md
  - Raid:
    - Inscription:
      - À faire: raid/01-inscription/taches.md
      - Journal: raid/01-inscription/suivi.md
    - Sponsoring:
      - Dossier: raid/02-sponsoring/dossier-fr.md
      - À faire: raid/02-sponsoring/taches.md
