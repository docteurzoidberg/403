    <line x1="0" y1="55" x2="18" y2="55" stroke-width="2"/>
    <line x1="3" y1="70" x2="20" y2="70" stroke-width="2"/>
  </g>

  <!-- Ombre au sol -->
  <ellipse cx="125" cy="92" rx="100" ry="3.5" fill="#000" opacity="0.35"/>

  <!-- Carrosserie 403 break (silhouette) -->
  <g fill="#ff6f3c" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round">
    <path d="
      M 32 85
      L 32 70
      Q 32 60 38 56
      L 70 48
      Q 78 42 90 38
      L 165 36
      Q 180 36 188 42
      L 210 50
      Q 220 53 222 60
      L 222 78
      Q 222 85 215 85
      L 32 85 Z
    "/>
  </g>

  <!-- Vitres -->
  <g fill="#1e293b" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round">
    <!-- Pare-brise -->
    <path d="M 78 50 L 92 42 L 118 41 L 118 50 Z"/>
    <!-- Vitre passagers -->
    <path d="M 122 41 L 156 41 L 156 50 L 122 50 Z"/>
    <!-- Vitre arrière break (allongée caractéristique du 403 break) -->
    <path d="M 160 41 L 200 42 L 206 50 L 160 50 Z"/>
  </g>

  <!-- Montants -->
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="120" y1="41" x2="120" y2="50"/>
