<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" role="img" aria-label="Projet 403 — Crazy Dust 2027">
  <!-- Particules de poussière (sablage raid) -->
  <g fill="#d97706" opacity="0.35">
    <circle cx="6" cy="92" r="1.4"/>
    <circle cx="18" cy="100" r="1"/>
    <circle cx="30" cy="96" r="1.3"/>
    <circle cx="48" cy="101" r="0.9"/>
    <circle cx="66" cy="98" r="1.1"/>
    <circle cx="84" cy="102" r="1.2"/>
    <circle cx="102" cy="99" r="0.9"/>
    <circle cx="120" cy="103" r="1.3"/>
    <circle cx="138" cy="100" r="1"/>
    <circle cx="156" cy="102" r="1.2"/>
    <circle cx="174" cy="98" r="1.1"/>
    <circle cx="192" cy="103" r="1"/>
    <circle cx="210" cy="100" r="1.3"/>
    <circle cx="225" cy="96" r="0.9"/>
  </g>

  <!-- Lignes de vitesse derrière la voiture -->
  <g stroke="#d97706" stroke-linecap="round" opacity="0.55">
