  <!-- Phare avant -->
  <circle cx="38" cy="65" r="3.5" fill="#fde68a" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Calandre -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="34" y1="72" x2="44" y2="72"/>
    <line x1="34" y1="76" x2="44" y2="76"/>
    <line x1="34" y1="80" x2="44" y2="80"/>
  </g>

  <!-- Poignée porte arrière -->
  <line x1="180" y1="68" x2="188" y2="68" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Autocollant rallye "403" (cercle blanc bordé) -->
  <g>
    <circle cx="140" cy="68" r="12.5" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.8"/>
    <text x="140" y="73" text-anchor="middle" font-family="'Arial Black', 'Helvetica', sans-serif" font-weight="900" font-size="13" fill="#1a1a1a">403</text>
  </g>

  <!-- Roue avant -->
  <g>
    <circle cx="60" cy="85" r="11" fill="#1a1a1a"/>
    <circle cx="60" cy="85" r="5.5" fill="#737373"/>
    <circle cx="60" cy="85" r="1.8" fill="#1a1a1a"/>
  </g>

  <!-- Roue arrière -->
  <g>
    <circle cx="195" cy="85" r="11" fill="#1a1a1a"/>
    <circle cx="195" cy="85" r="5.5" fill="#737373"/>
    <circle cx="195" cy="85" r="1.8" fill="#1a1a1a"/>
  </g>

  <!-- Soulèvement de poussière sous les roues -->
  <g fill="#d97706" opacity="0.5">
    <circle cx="50" cy="98" r="2"/>
    <circle cx="54" cy="100" r="1.5"/>
    <circle cx="185" cy="98" r="2"/>
